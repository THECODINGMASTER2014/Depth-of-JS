<body>
    <h1>Datatypes in JS</h1>
    <script>
        var a = 8;
        var b = 10;
        var d =  null;
        var e;  // undefined variable
        {
            let a = 2;
            // here value of the block is 2 but only inside the curly brackets
            const b = 8;
        }
        document.write("a and b are equal :" + (a==b))
        document.write("<br>");
         document.write("d :" + d)
         document.write("<br>");
         document.write("e :" + e)
         document.write("<br>");
         document.write("a :" + a)
         document.write("<br>");
         document.write("b :" + b)
    </script>
</body>
