<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="myFunction()"><h1>Try It</h1></button>
    <p id="hour"></p>
    <p id="greet"></p>
    <script>
        function myFunction(){
            var greeting
            var time = new Date().gethour();
            if (time < 10){
                greeting = "Good Morning";
            }
         else if (time < 20) {
                greeting = "Good Day";
            }
            else {
            greeting = "Good Evening";
            }
        
        document.getElementById("hour").innerHTML = "Current hour :"+ time;
        document.getElementById("greet").innerHTML = greeting;
        }

            
        
    </script>
</body>
</html>
